<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chat Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash/4.17.21/lodash.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #ffffff;
            --secondary-bg: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --sent-message-bg: #6366f1;
            --received-message-bg: #f1f5f9;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --radius-lg: 1rem;
            --radius-full: 9999px;
        }

        body.dark {
            --bg-color: #0f172a;
            --secondary-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --received-message-bg: #334155;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            height: 100vh;
            overflow: hidden;
        }

        /* Navbar Styles */
        .navbar {
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .navbar-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .icon-button {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 0.5rem;
            cursor: pointer;
            border-radius: var(--radius-lg);
            transition: all 0.2s;
        }

        .icon-button:hover {
            background: var(--secondary-bg);
            color: var(--primary-color);
        }

        /* Main Container */
        .container {
            display: flex;
            height: calc(100vh - 64px);
            margin-top: 64px;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--bg-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .search-bar {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-lg);
            width: 100%;
            color: var(--text-primary);
            margin-top: 1rem;
        }

        .chat-list {
            overflow-y: auto;
            flex: 1;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-item:hover {
            background: var(--secondary-bg);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .chat-preview {
            color: var(--text-secondary);
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }

        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 70%;
            padding: 1rem;
            border-radius: var(--radius-lg);
            position: relative;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            background: var(--sent-message-bg);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0.25rem;
        }

        .message.received {
            background: var(--received-message-bg);
            margin-right: auto;
            border-bottom-left-radius: 0.25rem;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .chat-input {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            background: var(--bg-color);
        }

        .input-container {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .message-box {
            flex: 1;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1rem;
            min-height: 50px;
            max-height: 150px;
            overflow-y: auto;
            resize: none;
            color: var(--text-primary);
        }

        .send-button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .send-button:hover {
            background: var(--primary-hover);
        }

        .typing-indicator {
            padding: 0.5rem 1.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .sidebar {
                width: 250px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -300px;
                height: calc(100% - 64px);
                background: var(--bg-color);
                z-index: 40;
            }

            .sidebar.active {
                left: 0;
            }

            .message {
                max-width: 85%;
            }
        }

        @media (max-width: 640px) {
            .navbar {
                padding: 1rem;
            }

            .chat-header {
                padding: 1rem;
            }

            .chat-messages {
                padding: 1rem;
            }

            .chat-input {
                padding: 1rem;
            }

            .message {
                max-width: 90%;
            }

            .send-button {
                padding: 1rem;
            }
        }

        /* Overlay for mobile sidebar */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 30;
        }

        .overlay.active {
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <button class="icon-button menu-toggle">
            <i class="fas fa-bars"></i>
        </button>
        <div class="navbar-brand">ChatApp</div>
        <div class="navbar-actions">
            <button class="icon-button theme-toggle">
                <i class="fas fa-moon"></i>
            </button>
            <button class="icon-button">
                <i class="fas fa-user"></i>
            </button>
        </div>
    </nav>

    <div class="overlay"></div>

    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Messages</h2>
                <input type="text" class="search-bar" placeholder="Search conversations...">
            </div>
            <div class="chat-list">
                <div class="chat-item">
                    <div class="avatar">JD</div>
                    <div class="chat-info">
                        <div class="chat-name">John Doe</div>
                        <div class="chat-preview">Hey, how are you doing?</div>
                    </div>
                </div>
                <div class="chat-item">
                    <div class="avatar">AS</div>
                    <div class="chat-info">
                        <div class="chat-name">Alice Smith</div>
                        <div class="chat-preview">Thanks for the update!</div>
                    </div>
                </div>
                <div class="chat-item">
                    <div class="avatar">RJ</div>
                    <div class="chat-info">
                        <div class="chat-name">Robert Johnson</div>
                        <div class="chat-preview">See you tomorrow!</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="chat-container">
            <div class="chat-header">
                <div class="avatar">JD</div>
                <div class="chat-info">
                    <div class="chat-name">John Doe</div>
                    <div class="chat-preview">Online</div>
                </div>
            </div>

            <div class="chat-messages">
                <div class="message received">
                    Hey! How's it going?
                    <div class="message-time">10:30 AM</div>
                </div>
                <div class="message sent">
                    Hi! I'm doing great, thanks for asking. How about you?
                    <div class="message-time">10:31 AM</div>
                </div>
                <div class="message received">
                    Pretty good! Just working on some new projects.
                    <div class="message-time">10:32 AM</div>
                </div>
            </div>

            <div class="typing-indicator"></div>

            <div class="chat-input">
                <div class="input-container">
                    <textarea class="message-box" placeholder="Type a message..."></textarea>
                    <button class="send-button">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Toggle sidebar on mobile
        const menuToggle = document.querySelector('.menu-toggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        });

        // Dark mode toggle
        const themeToggle = document.querySelector('.theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const icon = themeToggle.querySelector('i');
            icon.classList.toggle('fa-moon');
            icon.classList.toggle('fa-sun');
        });

        // Auto-expanding textarea
        const messageBox = document.querySelector('.message-box');
        messageBox.addEventListener('input', () => {
            messageBox.style.height = 'auto';
            messageBox.style.height = messageBox.scrollHeight + 'px';
        });

        // Send message functionality
        const sendButton = document.querySelector('.send-button');
        const chatMessages = document.querySelector('.chat-messages');
        const typingIndicator = document.querySelector('.typing-indicator');

        function getCurrentTime() {
            return new Date().toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true 
            });
        }

        function createMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', type);
            messageDiv.innerHTML = `
                ${text}
                <div class="message-time">${getCurrentTime()}</div>
            `;
            return messageDiv;
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendButton.addEventListener('click', () => {
    const message = messageBox.value.trim();
    if (message) {
        // Add sent message
        chatMessages.appendChild(createMessage(message, 'sent'));
        scrollToBottom();
        
        // Clear input
        messageBox.value = '';
        messageBox.style.height = 'auto';
        
        // Show typing indicator
        typingIndicator.innerHTML = `
            <div class="typing-animation">
                <span>John is typing</span>
                <span class="dot">.</span>
                <span class="dot">.</span>
                <span class="dot">.</span>
            </div>
        `;
        
        // Simulate response after delay
        setTimeout(() => {
            // Generate contextual response
            let response;
            if (message.toLowerCase().includes('hello') || message.toLowerCase().includes('hi')) {
                response = "Hello! How can I help you today?";
            } else if (message.toLowerCase().includes('how are you')) {
                response = "I'm doing great, thanks for asking! How about you?";
            } else if (message.toLowerCase().includes('bye')) {
                response = "Goodbye! Have a great day!";
            } else if (message.includes('?')) {
                response = "That's an interesting question. Let me think about it...";
            } else {
                // Array of generic responses
                const responses = [
                    "Thank you for sharing that!",
                    "I understand what you mean.",
                    "That's interesting! Tell me more.",
                    "I see what you're saying.",
                    "Thanks for the message!",
                    "Got it! Let me know if you need anything else."
                ];
                response = responses[Math.floor(Math.random() * responses.length)];
            }

            // Clear typing indicator
            typingIndicator.innerHTML = '';
            
            // Add received message with animation
            const receivedMessage = createMessage(response, 'received');
            receivedMessage.style.opacity = '0';
            chatMessages.appendChild(receivedMessage);
            
            // Trigger reflow for animation
            receivedMessage.offsetHeight;
            
            // Fade in the message
            receivedMessage.style.transition = 'opacity 0.3s ease';
            receivedMessage.style.opacity = '1';
            
            // Scroll to bottom
            scrollToBottom();
            
            // Update last message in sidebar
            const chatPreview = document.querySelector('.chat-item:first-child .chat-preview');
            if (chatPreview) {
                chatPreview.textContent = response;
            }
        }, 2000); // 2 second delay for response
    }
});

// Handle Enter key
messageBox.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendButton.click();
    }
});

// Add CSS for typing animation
const style = document.createElement('style');
style.textContent = `
    .typing-animation {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--text-secondary);
        font-size: 0.875rem;
    }

    .typing-animation .dot {
        animation: typingDot 1.4s infinite;
        opacity: 0.5;
    }

    .typing-animation .dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-animation .dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typingDot {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
    }
`;
document.head.appendChild(style);
</script>
